name: Update grants site

on:
  schedule:
    # Mondays 05:01 UTC (00:01 Eastern during standard time, 01:01 during daylight time)
    - cron: '1 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # commit the new CSV and eligibility cache back to the repo
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Download grants.gov CSV
        run: python fetch_grantgov.py

      - name: Build site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python build_site.py

      - name: Save downloaded data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants_data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update grants data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
